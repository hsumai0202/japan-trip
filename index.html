<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 日本旅遊規劃</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <style>
    .hours-result { background:#f0f9ff; border-radius:8px; padding:10px; margin-top:8px; font-size:.82rem; border:1px solid #c8e6fa; display:none; }
    .hours-result.show { display:block; }
    .hours-open { color:#2e7d32; font-weight:700; }
    .hours-closed { color:#c62828; font-weight:700; }
    .hours-list { color:#555; margin-top:4px; line-height:1.7; }
    .hours-apply-btn { margin-top:8px; background:#e3f0ff; border:none; border-radius:6px; padding:4px 10px; font-size:.78rem; cursor:pointer; color:#1565c0; font-family:inherit; }
    .hours-apply-btn:hover { background:#c8dff5; }
    .search-hours-btn { background:var(--blue-light); color:var(--blue); border:1px solid #aad0f5; border-radius:7px; padding:6px 10px; font-size:.78rem; cursor:pointer; font-family:inherit; white-space:nowrap; margin-top:6px; display:inline-flex; align-items:center; gap:4px; }
    .search-hours-btn:hover { background:#c8dff5; }
    .search-hours-btn:disabled { opacity:.5; cursor:not-allowed; }
    :root {
      --sakura: #f9a8c9; --sakura-dark: #e07fa0; --sakura-light: #fce4ec;
      --blue: #5b9bd5; --blue-light: #e3f0ff;
      --bg: #fff9fb; --white: #ffffff;
      --text: #3a2a35; --text-light: #8a7080;
      --border: #f0d8e5; --shadow: rgba(240,100,150,0.1);
      --red: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header { background: linear-gradient(135deg,#f06292,#e91e8c,#ad1457); color: white; padding: 20px 24px 0; box-shadow: 0 4px 20px rgba(233,30,140,.3); }
    .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .trip-title-area h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 1px; }
    .trip-title-area p { font-size: .85rem; opacity: .85; margin-top: 2px; }
    .header-stats { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .stat-chip { background: rgba(255,255,255,.2); border-radius: 20px; padding: 6px 14px; font-size: .82rem; display: flex; align-items: center; gap: 5px; }

    .sync-chip { background: rgba(255,255,255,.15); border-radius: 20px; padding: 5px 12px; font-size: .78rem; display: flex; align-items: center; gap: 5px; transition: background .3s; }
    .sync-chip.online  { background: rgba(100,255,150,.25); }
    .sync-chip.syncing { background: rgba(255,200,0,.3); }
    .sync-chip.offline { background: rgba(255,100,100,.3); }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #aaa; flex-shrink: 0; }
    .sync-chip.online  .sync-dot { background: #6fff9e; }
    .sync-chip.syncing .sync-dot { background: #ffe066; animation: pulse .8s infinite; }
    .sync-chip.offline .sync-dot { background: #ff6b6b; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .tabs { display: flex; }
    .tab-btn { flex: 1; background: rgba(255,255,255,.15); border: none; color: rgba(255,255,255,.8); padding: 12px 8px; font-size: .88rem; cursor: pointer; transition: all .2s; font-family: inherit; border-radius: 8px 8px 0 0; }
    .tab-btn.active { background: var(--white); color: #ad1457; font-weight: 700; }
    .tab-btn:hover:not(.active) { background: rgba(255,255,255,.25); color: white; }

    main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .day-section { background: var(--white); border-radius: 16px; margin-bottom: 20px; box-shadow: 0 2px 12px var(--shadow); overflow: hidden; border: 1px solid var(--border); }
    .day-header { background: linear-gradient(90deg,#fce4ec,#fff); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; cursor: pointer; user-select: none; }
    .day-header:hover { background: linear-gradient(90deg,#f8bbd0,#fff5f8); }
    .day-header-left { display: flex; align-items: center; gap: 12px; }
    .day-badge { background: linear-gradient(135deg,#e91e8c,#f06292); color: white; border-radius: 12px; padding: 4px 14px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
    .day-title { font-weight: 700; font-size: 1rem; }
    .day-meta { font-size: .78rem; color: var(--text-light); margin-top: 2px; }
    .day-header-right { display: flex; align-items: center; gap: 8px; }
    .day-cost-pill { background: #fff3e0; color: #e65100; border-radius: 20px; padding: 3px 10px; font-size: .78rem; font-weight: 600; }
    .weather-btn { background: var(--blue-light); color: var(--blue); border: none; border-radius: 8px; padding: 5px 10px; font-size: .78rem; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; }
    .weather-btn:hover { background: #c8dff5; }
    .add-stop-btn { background: var(--sakura-light); color: #ad1457; border: 1px dashed #f48fb1; border-radius: 8px; padding: 5px 12px; font-size: .78rem; cursor: pointer; font-family: inherit; }
    .add-stop-btn:hover { background: #fce4ec; }
    .collapse-icon { color: var(--text-light); font-size: 1.1rem; transition: transform .2s; }
    .day-section.collapsed .collapse-icon { transform: rotate(-90deg); }

    .stops-list { padding: 8px 18px 12px; }
    .day-section.collapsed .stops-list { display: none; }
    .stop-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .stop-item:last-child { border-bottom: none; }
    .stop-time-col { min-width: 52px; text-align: center; padding-top: 2px; }
    .stop-time { font-size: .78rem; color: var(--text-light); background: #f5f5f5; border-radius: 6px; padding: 2px 6px; }
    .stop-icon-col { display: flex; flex-direction: column; align-items: center; min-width: 24px; }
    .stop-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sakura-dark); border: 2px solid var(--sakura); flex-shrink: 0; margin-top: 4px; }
    .stop-line { width: 2px; flex: 1; background: var(--border); min-height: 20px; }
    .stop-content { flex: 1; }
    .stop-name { font-weight: 600; font-size: .95rem; }
    .stop-category-tag { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: .7rem; margin-left: 6px; font-weight: 600; }
    .cat-food { background: #fff3e0; color: #e65100; }
    .cat-sight { background: #e8f5e9; color: #2e7d32; }
    .cat-hotel { background: #e3f0ff; color: #1565c0; }
    .cat-transport { background: #f3e5f5; color: #6a1b9a; }
    .cat-other { background: #f5f5f5; color: #555; }
    .stop-note { font-size: .8rem; color: var(--text-light); margin-top: 3px; }
    .stop-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .stop-cost { font-size: .82rem; color: #e65100; font-weight: 600; min-width: 60px; text-align: right; }
    .map-link { color: var(--blue); text-decoration: none; font-size: .78rem; display: inline-flex; align-items: center; gap: 3px; margin-top: 4px; }
    .map-link:hover { text-decoration: underline; }

    .add-day-bar { text-align: center; margin: 8px 0 24px; }
    .add-day-btn { background: white; border: 2px dashed var(--sakura); color: #ad1457; border-radius: 12px; padding: 10px 28px; font-size: .9rem; cursor: pointer; font-family: inherit; transition: all .2s; }
    .add-day-btn:hover { background: var(--sakura-light); }

    .budget-summary { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px var(--shadow); border: 1px solid var(--border); margin-bottom: 20px; }
    .budget-summary h3 { font-size: 1rem; margin-bottom: 14px; }
    .budget-bars { display: flex; flex-direction: column; gap: 10px; }
    .budget-row { display: flex; align-items: center; gap: 10px; }
    .budget-label { min-width: 80px; font-size: .82rem; color: var(--text-light); }
    .budget-bar-wrap { flex: 1; height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; }
    .budget-bar-fill { height: 100%; border-radius: 4px; transition: width .4s; }
    .budget-amount { min-width: 80px; text-align: right; font-size: .82rem; font-weight: 600; }
    .budget-total-row { display: flex; justify-content: space-between; padding-top: 14px; margin-top: 10px; border-top: 2px solid var(--border); }
    .budget-total-label { font-weight: 700; font-size: .95rem; }
    .budget-total-amount { font-weight: 700; font-size: 1.1rem; color: #e65100; }
    .expense-list { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px var(--shadow); border: 1px solid var(--border); }
    .expense-list h3 { font-size: 1rem; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .expense-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .expense-table th { text-align: left; padding: 8px 10px; background: #fce4ec; color: #ad1457; font-weight: 600; }
    .expense-table th:first-child { border-radius: 8px 0 0 8px; }
    .expense-table th:last-child { border-radius: 0 8px 8px 0; text-align: right; }
    .expense-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
    .expense-table td:last-child { text-align: right; font-weight: 600; color: #e65100; }
    .expense-table tr:hover td { background: #fff9fb; }

    .pack-section { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px var(--shadow); border: 1px solid var(--border); margin-bottom: 16px; }
    .pack-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .pack-section-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .95rem; }
    .pack-progress { font-size: .78rem; color: var(--text-light); }
    .pack-prog-bar { height: 4px; background: #f0f0f0; border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
    .pack-prog-fill { height: 100%; background: linear-gradient(90deg,var(--sakura-dark),#f06292); border-radius: 2px; transition: width .3s; }
    .pack-items { display: flex; flex-direction: column; gap: 6px; }
    .pack-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; cursor: pointer; transition: background .15s; }
    .pack-item:hover { background: #f9f9f9; }
    .pack-item.checked { opacity: .5; }
    .pack-item.checked .pack-item-name { text-decoration: line-through; color: var(--text-light); }
    .pack-checkbox { width: 18px; height: 18px; border: 2px solid var(--sakura-dark); border-radius: 5px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: .75rem; color: white; }
    .pack-item.checked .pack-checkbox { background: var(--sakura-dark); }
    .pack-item-name { font-size: .88rem; flex: 1; }
    .pack-add-row { display: flex; gap: 8px; margin-top: 10px; }
    .pack-add-input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: .85rem; font-family: inherit; outline: none; }
    .pack-add-input:focus { border-color: var(--sakura-dark); }
    .pack-add-submit { background: var(--sakura-dark); color: white; border: none; border-radius: 8px; padding: 7px 14px; font-size: .85rem; cursor: pointer; font-family: inherit; }
    .section-action-btn { background: var(--sakura-light); color: #ad1457; border: none; border-radius: 8px; padding: 5px 12px; font-size: .78rem; cursor: pointer; font-family: inherit; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 20px; padding: 28px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,.2); max-height: 90vh; overflow-y: auto; }
    .modal h2 { font-size: 1.1rem; margin-bottom: 20px; color: #ad1457; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 5px; color: var(--text-light); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: .9rem; font-family: inherit; outline: none; transition: border .2s; background: white; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--sakura-dark); }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary { flex: 1; background: linear-gradient(135deg,#e91e8c,#f06292); color: white; border: none; border-radius: 10px; padding: 11px; font-size: .92rem; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-primary:hover { opacity: .9; }
    .btn-secondary { flex: 1; background: #f5f5f5; color: var(--text); border: none; border-radius: 10px; padding: 11px; font-size: .92rem; cursor: pointer; font-family: inherit; }
    .btn-secondary:hover { background: #ebebeb; }
    .btn-danger { background: #ffeaea; color: var(--red); border: none; border-radius: 10px; padding: 11px 18px; font-size: .92rem; cursor: pointer; font-family: inherit; }
    .btn-danger:hover { background: #ffcdd2; }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #333; color: white; padding: 10px 22px; border-radius: 20px; font-size: .88rem; z-index: 2000; transition: transform .3s; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 10px; }

    @media (max-width: 600px) {
      header { padding: 16px 14px 0; }
      .trip-title-area h1 { font-size: 1.3rem; }
      main { padding: 14px 10px 60px; }
      .day-header { padding: 12px 14px; }
      .stops-list { padding: 6px 14px 10px; }
      .modal { padding: 20px; }
    }
  .icon-btn{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;font-size:.9rem;opacity:.6;transition:all .15s}
    .icon-btn:hover{opacity:1;background:#f5f5f5}
  .lock-btn { background:rgba(255,255,255,.2); border:1.5px solid rgba(255,255,255,.5); color:white; border-radius:20px; padding:6px 14px; font-size:.82rem; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:5px; transition:all .2s; }
  .lock-btn:hover { background:rgba(255,255,255,.35); }
  .lock-btn.locked { background:rgba(255,220,0,.3); border-color:rgba(255,220,0,.6); }
  .locked-banner { display:none; background:#fff8e1; border-bottom:2px solid #ffe082; padding:8px 20px; text-align:center; font-size:.85rem; color:#e65100; font-weight:600; }
  .locked-banner.show { display:block; }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="trip-title-area">
      <h1>🌸 日本家庭旅遊</h1>
      <p id="tripDateRange">載入中...</p>
    </div>
    <div class="header-stats">
      <div class="stat-chip">📅 <span id="totalDays">0</span> 天</div>
      <div class="stat-chip">📍 <span id="totalStops">0</span> 景點</div>
      <div class="stat-chip">💴 ¥<span id="totalBudget">0</span></div>
      <div class="sync-chip" id="syncChip"><div class="sync-dot"></div><span id="syncLabel">連線中...</span></div>
      <button class="lock-btn" id="lockBtn" onclick="toggleLock()">🔓 瀏覽模式</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('itinerary',this)">📅 行程規劃</button>
    <button class="tab-btn" onclick="switchTab('budget',this)">💴 費用記帳</button>
    <button class="tab-btn" onclick="switchTab('packing',this)">🎒 打包清單</button>
  </div>
</header>

<div class="locked-banner" id="lockedBanner">🔒 行程已鎖定，目前為純瀏覽模式，無法新增或修改</div>
<main>
  <div class="tab-panel active" id="tab-itinerary">
    <div id="days-container"></div>
    <div class="add-day-bar" id="addDayBar"></div>
  </div>

  <div class="tab-panel" id="tab-budget">
    <div class="budget-summary">
      <h3>📊 費用分類總覽</h3>
      <div class="budget-bars" id="budget-bars"></div>
      <div class="budget-total-row">
        <span class="budget-total-label">總花費</span>
        <span class="budget-total-amount">¥<span id="grand-total">0</span></span>
      </div>
    </div>
    <div class="expense-list">
      <h3>明細清單 <span style="font-size:.8rem;color:var(--text-light);font-weight:400">依日期排列</span></h3>
      <table class="expense-table">
        <thead><tr><th>日期</th><th>景點/活動</th><th>類型</th><th>金額 (¥)</th></tr></thead>
        <tbody id="expense-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="tab-panel" id="tab-packing">
    <div id="pack-container"></div>
  </div>
</main>

<!-- Stop Modal -->
<div class="modal-overlay" id="stopModal">
  <div class="modal">
    <h2 id="stopModalTitle">新增景點</h2>
    <div class="form-row">
      <div class="form-group"><label>時間</label><input type="time" id="stopTime" value="09:00"></div>
      <div class="form-group"><label>類型</label>
        <select id="stopCategory">
          <option value="sight">🏯 景點</option>
          <option value="food">🍜 餐廳</option>
          <option value="hotel">🏨 住宿</option>
          <option value="transport">🚄 交通</option>
          <option value="other">📌 其他</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>名稱 *</label>
      <input type="text" id="stopName" placeholder="例：淺草寺">
      <button class="search-hours-btn" id="searchHoursBtn" onclick="searchPlaceHours()">🔍 查詢營業時間</button>
      <div class="hours-result" id="hoursResult"></div>
    </div>
    <div class="form-group"><label>地址（用於 Google 地圖）</label><input type="text" id="stopAddress" placeholder="例：東京都台東區淺草2丁目3-1"></div>
    <div class="form-group"><label>備註</label><textarea id="stopNote" rows="2" placeholder="開放時間、注意事項..."></textarea></div>
    <div class="form-group"><label>費用 (日圓 ¥)</label><input type="number" id="stopCost" placeholder="0" min="0"></div>
    <div class="modal-actions">
      <button class="btn-danger" id="stopDeleteBtn" onclick="deleteStop()" style="display:none">刪除</button>
      <button class="btn-secondary" onclick="closeStopModal()">取消</button>
      <button class="btn-primary" onclick="saveStop()">儲存</button>
    </div>
  </div>
</div>

<!-- Day Modal -->
<div class="modal-overlay" id="dayModal">
  <div class="modal" style="max-width:380px">
    <h2 id="dayModalTitle">新增一天</h2>
    <div class="form-group"><label>日期</label><input type="date" id="dayDate"></div>
    <div class="form-group"><label>城市/地點</label><input type="text" id="dayCity" placeholder="例：東京"></div>
    <div class="form-group"><label>當日主題（可選）</label><input type="text" id="dayTheme" placeholder="例：探索淺草文化"></div>
    <div class="modal-actions">
      <button class="btn-danger" id="dayDeleteBtn" onclick="deleteDay()" style="display:none">刪除此天</button>
      <button class="btn-secondary" onclick="closeDayModal()">取消</button>
      <button class="btn-primary" onclick="saveDay()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Firebase 設定 ──
const firebaseConfig = {
  apiKey: "AIzaSyAwA1RVbXqaCJh3PR0I_tOkQxTljhhRdfI",
  authDomain: "japan-trip-2fa53.firebaseapp.com",
  databaseURL: "https://japan-trip-2fa53-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "japan-trip-2fa53",
  storageBucket: "japan-trip-2fa53.firebasestorage.app",
  messagingSenderId: "743328715751",
  appId: "1:743328715751:web:7f80dd45a7c5d076ed2342"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const tripRef = db.ref('tripData');

function setSyncStatus(status) {
  const chip = document.getElementById('syncChip');
  const label = document.getElementById('syncLabel');
  chip.className = 'sync-chip ' + status;
  label.textContent = { online: '已同步', syncing: '同步中...', offline: '離線' }[status] || '';
}

// ── 預設資料 ──
const DEFAULT_DATA = {
  days: [
    { id:'d1', date:'2026-07-20', city:'東京', theme:'抵達！探索淺草', stops:[

function toggleLock() {

function applyLockUI() {
  const btn = document.getElementById('lockBtn');
  const banner = document.getElementById('lockedBanner');
  if (isLocked) {
    btn.textContent = '🔒 編輯模式';
    btn.classList.add('locked');

    banner.classList.remove('show');
  }
  render();
}

});

// ── Firebase 陣列轉換（Firebase 會把陣列存成物件） ──
function toArr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  return Object.values(v);
}
function normalizeData(raw) {
  return {
    days: toArr(raw.days).map(d => ({ ...d, stops: toArr(d.stops) })),
    packing: toArr(raw.packing).map(c => ({ ...c, items: toArr(c.items) }))
  };
}

function saveData() {
  setSyncStatus('syncing');
  tripRef.set(data)
    .then(() => setSyncStatus('online'))
    .catch(() => setSyncStatus('offline'));
}

function uid() { return '_' + Math.random().toString(36).slice(2,9); }

// ⭐ 在下面填入你的 Google Maps API Key
const GOOGLE_MAPS_KEY = 'AIzaSyDnqEhYmBnBYZ7CXF0-VPMFqfW8bWkXpUI';

let placesService = null;
(function initPlaces() {
  if (!GOOGLE_MAPS_KEY || GOOGLE_MAPS_KEY === 'YOUR_API_KEY_HERE') return;
  const s = document.createElement('script');
  s.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_KEY}&libraries=places&callback=_onMapsReady`;
  s.async = true; s.defer = true;
  document.head.appendChild(s);
})();
window._onMapsReady = function() {
  const div = document.createElement('div');
  placesService = new google.maps.places.PlacesService(div);
};

function searchPlaceHours() {
  const name = document.getElementById('stopName').value.trim();
  if (!name) { showToast('請先輸入景點或店家名稱'); return; }
  const resultDiv = document.getElementById('hoursResult');
  if (!placesService) {
    resultDiv.innerHTML = '<div style="color:#c62828">⚠️ 尚未設定 Google Maps API Key，請聯絡設定者填入。</div>';
    resultDiv.classList.add('show'); return;
  }
  const btn = document.getElementById('searchHoursBtn');
  btn.textContent = '🔍 查詢中...'; btn.disabled = true;
  resultDiv.classList.remove('show');

  placesService.findPlaceFromQuery(
    { query: name, fields: ['place_id','name'] },
    function(results, status) {
      if (status !== google.maps.places.PlacesServiceStatus.OK || !results || !results.length) {
        btn.textContent = '🔍 查詢營業時間'; btn.disabled = false;
        showToast('找不到此地點，請嘗試更詳細的名稱（如加上城市）'); return;
      }
      placesService.getDetails(
        { placeId: results[0].place_id, fields: ['name','opening_hours','business_status','formatted_address'] },
        function(place, st) {
          btn.textContent = '🔍 查詢營業時間'; btn.disabled = false;
          if (st !== google.maps.places.PlacesServiceStatus.OK) {
            showToast('無法取得詳細資訊'); return;
          }
          showHoursResult(place);
        }
      );
    }
  );
}

function showHoursResult(place) {
  const div = document.getElementById('hoursResult');
  let html = `<div style="font-weight:700;margin-bottom:6px">📍 ${place.name}</div>`;
  if (place.business_status === 'CLOSED_PERMANENTLY') {
    html += `<div class="hours-closed">⛔ 此店家已永久停業</div>`;
  } else if (place.opening_hours) {
    const isOpen = place.opening_hours.isOpen();
    html += `<div class="${isOpen?'hours-open':'hours-closed'}">${isOpen?'🟢 目前營業中':'🔴 目前休息中'}</div>`;
    if (place.opening_hours.weekday_text && place.opening_hours.weekday_text.length) {
      html += `<div class="hours-list">` + place.opening_hours.weekday_text.map(t=>`<div>${t}</div>`).join('') + `</div>`;
      window._hoursText = '【營業時間】\n' + place.opening_hours.weekday_text.join('\n');
      html += `<button class="hours-apply-btn" onclick="applyHoursToNote()">📋 填入備注欄位</button>`;
    }
  } else {
    html += `<div style="color:#888">此地點無營業時間資訊（可能是景點或交通設施）</div>`;
  }
  div.innerHTML = html;
  div.classList.add('show');
}

function applyHoursToNote() {
  const note = document.getElementById('stopNote');
  const cur = note.value.trim();
  note.value = cur ? cur + '\n' + (window._hoursText||'') : (window._hoursText||'');
  showToast('✅ 營業時間已填入備注');
}

// ── 渲染 ──
function render() { renderHeader(); renderItinerary(); }

function renderHeader() {
  const days = data.days || [];
  document.getElementById('totalDays').textContent = days.length;
  const stops = days.reduce((a,d) => a + (d.stops||[]).length, 0);
  document.getElementById('totalStops').textContent = stops;
  const total = days.reduce((a,d) => a + (d.stops||[]).reduce((b,s) => b+(s.cost||0),0), 0);
  document.getElementById('totalBudget').textContent = total.toLocaleString();
  if (days.length > 0) {
    const sorted = [...days].sort((a,b) => a.date.localeCompare(b.date));
    document.getElementById('tripDateRange').textContent = formatDate(sorted[0].date) + ' ～ ' + formatDate(sorted[sorted.length-1].date);
  } else {
    document.getElementById('tripDateRange').textContent = '尚未設定日期';
  }
}

function formatDate(s) {
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('zh-TW', { month:'long', day:'numeric' });
}

function renderItinerary() {
  document.getElementById('addDayBar').innerHTML = isLocked ? '' : '<button class="add-day-btn" onclick="openAddDayModal()">＋ 新增一天</button>';
  const c = document.getElementById('days-container');
  const days = data.days || [];
  if (!days.length) {
    c.innerHTML = '<div class="empty-state"><div class="emoji">✈️</div><p>還沒有行程，點擊下方「新增一天」開始規劃吧！</p></div>';
    return;
  }
  const sorted = [...days].sort((a,b) => a.date.localeCompare(b.date));
  c.innerHTML = sorted.map((day, idx) => {
    const dayCost = (day.stops||[]).reduce((a,s) => a+(s.cost||0), 0);
    const dateLabel = new Date(day.date+'T12:00:00').toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'});
    const weatherUrl = 'https://www.google.com/search?q=' + encodeURIComponent((day.city||'東京')+'天氣');
    return `<div class="day-section" id="day-${day.id}">
      <div class="day-header" onclick="toggleDay('${day.id}')">
        <div class="day-header-left">
          <span class="day-badge">Day ${idx+1}</span>
          <div>
            <div class="day-title">${esc(day.city)}${day.theme?' · '+esc(day.theme):''}</div>
            <div class="day-meta">${dateLabel}</div>
          </div>
        </div>
        <div class="day-header-right">
          ${dayCost>0?`<span class="day-cost-pill">¥${dayCost.toLocaleString()}</span>`:''}
          <a class="weather-btn" href="${weatherUrl}" target="_blank" onclick="event.stopPropagation()">🌤️ 天氣</a>
          ${!isLocked?`<button class="add-stop-btn" onclick="event.stopPropagation();openAddStopModal('${day.id}')">＋ 新增景點</button>`:''}
          ${!isLocked?`<button class="icon-btn" onclick="event.stopPropagation();openEditDayModal('${day.id}')" title="編輯">✏️</button>`:''}
          <span class="collapse-icon">▾</span>
        </div>
      </div>
      <div class="stops-list">
        ${!(day.stops&&day.stops.length)
          ? '<div style="text-align:center;padding:20px;color:var(--text-light);font-size:.85rem">這天還沒有行程！</div>'
          : (day.stops||[]).map((s,si) => renderStop(s, day.id, si===day.stops.length-1)).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderStop(s, dayId, isLast) {
  const catLabel = {sight:'🏯 景點',food:'🍜 餐廳',hotel:'🏨 住宿',transport:'🚄 交通',other:'📌 其他'};
  const catClass = {sight:'cat-sight',food:'cat-food',hotel:'cat-hotel',transport:'cat-transport',other:'cat-other'};
  const mapUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address||s.name);
  return `<div class="stop-item">
    <div class="stop-time-col"><span class="stop-time">${s.time||'--:--'}</span></div>
    <div class="stop-icon-col">
      <div class="stop-dot"></div>
      ${!isLast?'<div class="stop-line"></div>':''}
    </div>
    <div class="stop-content">
      <div><span class="stop-name">${esc(s.name)}</span>
        <span class="stop-category-tag ${catClass[s.category]||'cat-other'}">${catLabel[s.category]||s.category}</span>
      </div>
      ${s.note?`<div class="stop-note">${esc(s.note)}</div>`:''}
      <a class="map-link" href="${mapUrl}" target="_blank">📍 在 Google 地圖上查看</a>
    </div>
    <div class="stop-actions">
      ${s.cost>0?`<span class="stop-cost">¥${s.cost.toLocaleString()}</span>`:''}
      ${!isLocked?`<button class="icon-btn" onclick="openEditStopModal('${dayId}','${s.id}')">✏️</button>`:''}
    </div>
  </div>`;
}

function renderBudget() {
  const cats = [
    {key:'sight',label:'景點門票',color:'#4caf7d',icon:'🏯'},
    {key:'food',label:'餐飲',color:'#ff9800',icon:'🍜'},
    {key:'hotel',label:'住宿',color:'#5b9bd5',icon:'🏨'},
    {key:'transport',label:'交通',color:'#9c27b0',icon:'🚄'},
    {key:'other',label:'其他',color:'#78909c',icon:'📌'}
  ];
  const allStops = [];
  (data.days||[]).forEach(d => (d.stops||[]).forEach(s => allStops.push({...s,dayDate:d.date,dayCity:d.city})));
  const totals = {}; cats.forEach(c => totals[c.key]=0);
  allStops.forEach(s => { totals[s.category]!=null ? totals[s.category]+=(s.cost||0) : totals.other+=(s.cost||0); });
  const grand = Object.values(totals).reduce((a,b)=>a+b,0);
  document.getElementById('grand-total').textContent = grand.toLocaleString();
  document.getElementById('budget-bars').innerHTML = cats.map(c => {
    const pct = grand>0?Math.round(totals[c.key]/grand*100):0;
    return `<div class="budget-row">
      <span class="budget-label">${c.icon} ${c.label}</span>
      <div class="budget-bar-wrap"><div class="budget-bar-fill" style="width:${pct}%;background:${c.color}"></div></div>
      <span class="budget-amount">¥${totals[c.key].toLocaleString()}</span>
    </div>`;
  }).join('');
  const withCost = allStops.filter(s=>s.cost>0).sort((a,b)=>a.dayDate.localeCompare(b.dayDate));
  const catIcons = {sight:'🏯',food:'🍜',hotel:'🏨',transport:'🚄',other:'📌'};
  document.getElementById('expense-tbody').innerHTML = !withCost.length
    ? '<tr><td colspan="4" style="text-align:center;color:var(--text-light);padding:24px">尚無費用記錄</td></tr>'
    : withCost.map(s => {
        const dl = new Date(s.dayDate+'T12:00:00').toLocaleDateString('zh-TW',{month:'short',day:'numeric'});
        return `<tr><td>${dl} ${esc(s.dayCity)}</td><td>${esc(s.name)}</td><td>${catIcons[s.category]||'📌'}</td><td>¥${(s.cost||0).toLocaleString()}</td></tr>`;
      }).join('');
}

function renderPacking() {
  document.getElementById('pack-container').innerHTML = (data.packing||[]).map(cat => {
    const checked = (cat.items||[]).filter(i=>i.checked).length;
    const total = (cat.items||[]).length;
    const pct = total>0?Math.round(checked/total*100):0;
    return `<div class="pack-section">
      <div class="pack-section-header">
        <div class="pack-section-title">${esc(cat.name)}<span class="pack-progress">${checked}/${total}</span></div>
        <button class="section-action-btn" onclick="checkAllInCat('${cat.id}')">全選</button>
      </div>
      <div class="pack-prog-bar"><div class="pack-prog-fill" style="width:${pct}%"></div></div>
      <div class="pack-items">
        ${(cat.items||[]).map(item => `
        <div class="pack-item${item.checked?' checked':''}" onclick="togglePackItem('${cat.id}','${item.id}')">
          <div class="pack-checkbox">${item.checked?'✓':''}</div>
          <span class="pack-item-name">${esc(item.name)}</span>
          <button class="icon-btn" onclick="event.stopPropagation();deletePackItem('${cat.id}','${item.id}')">✕</button>
        </div>`).join('')}
      </div>
      <div class="pack-add-row">
        <input class="pack-add-input" type="text" placeholder="新增物品..." id="packInput-${cat.id}"
          onkeydown="if(event.key==='Enter')addPackItem('${cat.id}')">
        <button class="pack-add-submit" onclick="addPackItem('${cat.id}')">＋</button>
      </div>
    </div>`;
  }).join('');
}

  document.getElementById('stopName').value=s.name;
  document.getElementById('stopAddress').value=s.address||'';
  document.getElementById('stopNote').value=s.note||'';
  document.getElementById('stopCost').value=s.cost||'';
  document.getElementById('stopTime').value=s.time||'09:00';
  document.getElementById('stopCategory').value=s.category||'sight';
  document.getElementById('stopDeleteBtn').style.display='inline-flex';
  document.getElementById('stopModal').classList.add('open');
}
function closeStopModal() { document.getElementById('stopModal').classList.remove('open'); }
function saveStop() {
  const name=document.getElementById('stopName').value.trim();
  if (!name) { showToast('請輸入景點名稱'); return; }
  const sd={name,address:document.getElementById('stopAddress').value.trim(),
    note:document.getElementById('stopNote').value.trim(),
    cost:parseInt(document.getElementById('stopCost').value)||0,
    time:document.getElementById('stopTime').value,
    category:document.getElementById('stopCategory').value};
  const day=data.days.find(d=>d.id===editingStopDayId);
  if (editingStopId) {
    const idx=day.stops.findIndex(s=>s.id===editingStopId);
    day.stops[idx]={...day.stops[idx],...sd};
    showToast('✅ 景點已更新');
  } else {
    day.stops.push({id:uid(),...sd});
    showToast('✅ 景點已新增');
  }
  saveData(); render(); closeStopModal();
}
function deleteStop() {
  if (!confirm('確定要刪除這個景點嗎？')) return;
  const day=data.days.find(d=>d.id===editingStopDayId);
  day.stops=day.stops.filter(s=>s.id!==editingStopId);
  saveData(); render(); closeStopModal(); showToast('🗑️ 景點已刪除');
}

// ── Day Modal ──
function openAddDayModal() {
  editingDayId=null;
  document.getElementById('dayModalTitle').textContent='新增一天';
  document.getElementById('dayDate').value=getNextDate();
  document.getElementById('dayCity').value='';
  document.getElementById('dayTheme').value='';
  document.getElementById('dayDeleteBtn').style.display='none';
  document.getElementById('dayModal').classList.add('open');
}
function openEditDayModal(id) {
  editingDayId=id;
  const day=data.days.find(d=>d.id===id);
  document.getElementById('dayModalTitle').textContent='編輯此天';
  document.getElementById('dayDate').value=day.date;
  document.getElementById('dayCity').value=day.city;
  document.getElementById('dayTheme').value=day.theme||'';
  document.getElementById('dayDeleteBtn').style.display='inline-flex';
  document.getElementById('dayModal').classList.add('open');
}
function closeDayModal() { document.getElementById('dayModal').classList.remove('open'); }
function saveDay() {
  const date=document.getElementById('dayDate').value;
  const city=document.getElementById('dayCity').value.trim();
  if (!date||!city) { showToast('請填寫日期和城市'); return; }
  const dd={date,city,theme:document.getElementById('dayTheme').value.trim()};
  if (editingDayId) {
    const idx=data.days.findIndex(d=>d.id===editingDayId);
    data.days[idx]={...data.days[idx],...dd};
    showToast('✅ 行程已更新');
  } else {
    data.days.push({id:uid(),...dd,stops:[]});
    showToast('✅ 已新增一天');
  }
  saveData(); render(); closeDayModal();
}
function deleteDay() {
  if (!confirm('確定要刪除這一天（含所有景點）嗎？')) return;
  data.days=data.days.filter(d=>d.id!==editingDayId);
  saveData(); render(); closeDayModal(); showToast('🗑️ 此天已刪除');
}
function getNextDate() {
  if (!data.days.length) return new Date().toISOString().split('T')[0];
  const sorted=[...data.days].sort((a,b)=>a.date.localeCompare(b.date));
  const last=new Date(sorted[sorted.length-1].date+'T12:00:00');
  last.setDate(last.getDate()+1);
  return last.toISOString().split('T')[0];
}

// ── Packing ──
function togglePackItem(catId, itemId) {
  const cat=data.packing.find(c=>c.id===catId);
  const item=cat.items.find(i=>i.id===itemId);
  item.checked=!item.checked;
  saveData(); renderPacking();
}
function deletePackItem(catId, itemId) {
  const cat=data.packing.find(c=>c.id===catId);
  cat.items=cat.items.filter(i=>i.id!==itemId);
  saveData(); renderPacking();
}
function addPackItem(catId) {
  const input=document.getElementById('packInput-'+catId);
  const name=input.value.trim();
  if (!name) return;
  const cat=data.packing.find(c=>c.id===catId);
  cat.items.push({id:uid(),name,checked:false});
  input.value='';
  saveData(); renderPacking();
}
function checkAllInCat(catId) {
  const cat=data.packing.find(c=>c.id===catId);
  const all=cat.items.every(i=>i.checked);
  cat.items.forEach(i=>i.checked=!all);
  saveData(); renderPacking();
}

// ── Utils ──
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
// 缺少 icon-btn style inline fallback





// ── 初始化 ──
render();

// Firebase 即時監聽（任何人修改，全家自動更新）
tripRef.on('value', function(snapshot) {
  const val = snapshot.val();
  if (val) {
    data = normalizeData(val);
  } else {
    // 第一次使用，寫入預設資料
    saveData();
  }
  render();
  setSyncStatus('online');
});

// 連線狀態監聽
db.ref('.info/connected').on('value', function(snap) {
  if (!snap.val()) setSyncStatus('offline');
});
</script>
